# .github/workflows/ci.yml — run the gates this repo already has, on every push.
#
# There is no test suite and no linter here by design; `npm run typecheck` and
# the four scripts around it ARE the gates, and until this file existed nothing
# ran them automatically. `docker.yml` builds the images, which runs `npm run
# build` as a side effect of the image build — but only on `main` and `develop`,
# only after a push has already landed, and it reports a failure as "the image
# did not build" rather than as the type error it was.
#
# **The gap this closes was measured rather than assumed.** `npm run build` used
# to run a bare `tsc --noEmit`, which takes the ROOT tsconfig, whose `include` is
# `["src", "main.ts"]` — `server/` was in no project any gate ran. `build:server`
# could not cover it either: it is a `vite build`, and esbuild strips types
# without reading them. A deliberate `const x: number = "s"` in
# `server/Roster.ts` errored under the server tsconfig, exited 0 under the root
# one, and still emitted a server bundle. `package.json`'s `build` now runs
# `npm run typecheck`, which is both projects; this file is what makes sure
# somebody notices when it fails.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A second push to a branch makes the in-flight run irrelevant — the same
# rationale as `docker.yml`'s group, and the same shape.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The deterministic half: no browser, no GPU, no network beyond npm. This is
  # the job that must stay green, and it is exactly what the Dockerfile runs, so
  # a red one here means the image build would have failed too — reported in
  # thirty seconds against a named file instead of ten minutes into a push.
  # ---------------------------------------------------------------------------
  gates:
    name: gates
    runs-on: ubuntu-latest
    # Roughly four minutes of work, so this is a tripwire rather than a budget:
    # every step here is deterministic and none of them waits on anything, so a
    # run that reaches thirty minutes is stuck and should be killed rather than
    # left to GitHub's 360-minute default. The parity job that used to sit below
    # is why this line exists — see the block at the foot of the file.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The floor `README.md` states. `npm ci` is the slow step and the
          # lockfile rarely moves, so it is worth caching here as it is in the
          # image build.
          node-version: 20
          cache: npm

      - run: npm ci

      # Both tsconfigs, ahead of the build that would run them anyway, so that a
      # type error is reported as a type error rather than as a failed bundle.
      # It costs seconds and it names the file.
      - name: typecheck (client + server)
        run: npm run typecheck

      # The collision-bake staleness guard, the deep-import guard, the client
      # bundle and the proving-ground sentinel check, in that order — this is
      # `npm run build`, and it is the first Dockerfile RUN line verbatim.
      #
      # NOTE the guard's own limit, which is stated in CLAUDE.md and is not
      # something this file can fix: `check-collision.mjs` hashes the LAYOUT, so
      # a `porous`/`rayOnly` flag changed in a BUILDER leaves the bake stale
      # without tripping it. `npm run parity` is what actually catches that, and
      # it is NOT in this workflow — see the block at the foot of the file for
      # why, and run it by hand after anything touching the world layer.
      - name: build (collision + deep-import gates, typecheck, bundle)
        run: npm run build

      # The second Dockerfile RUN line. Transpile-only — it proves the server
      # bundles, and the typecheck above is what proves it is correct.
      - name: build server
        run: npm run build:server

      # `npm run build` runs `check-proving` BEFORE `dist-server/` exists on a
      # fresh checkout, so that pass only ever scans `dist/`. The script filters
      # its roots by `existsSync`, so this second run is what puts the server
      # bundle under the same sentinel scan — the one that proves 900 kB of
      # DEV-only proving ground is in neither artefact.
      - name: check proving ground is in neither bundle
        run: node scripts/check-proving.mjs

  # ---------------------------------------------------------------------------
  # THERE IS NO PARITY JOB HERE, AND THIS BLOCK IS WHY — DO NOT ADD ONE BACK
  # WITHOUT READING IT.
  #
  # `npm run parity` is the gate that catches what the bake-staleness hash
  # cannot: it rebuilds the world on both sides and compares the NAV GRAPH, so a
  # builder-side `porous`/`rayOnly` change that left the bake stale shows up as a
  # server whose walls stand somewhere else from its clients'. It is worth
  # wanting in CI. It was tried here, on 2026-08-29, and taken straight back out.
  #
  # **It did not fail. It HUNG — an hour and a half on a `ubuntu-latest` runner
  # with no sign of stopping.** That is the important half, because it is not the
  # failure mode the job was written to expect. `scripts/browser.mjs` needs a
  # Chromium that hands back a WebGPU adapter, since `main.ts` gates the boot on
  # one; without an adapter `Game` is never constructed and every browser-driven
  # script in this repo sits on `waitForFunction` waiting for `window.__celshock`
  # to appear on a page that will never define it. A GitHub runner has no GPU,
  # and the software path does not stand in — measured locally on the Windows
  # box, `--enable-unsafe-swiftshader --disable-gpu` returns a null adapter, as
  # does the headless shell, while `channel: "chromium"` on real hardware returns
  # one (nvidia/lovelace).
  #
  # **`continue-on-error: true` does not protect against this and that was the
  # mistake.** It downgrades a FAILED job to a non-blocking one; it does nothing
  # at all to a job that never finishes. The missing line was `timeout-minutes`,
  # and with GitHub's default job cap at 360 minutes the run was on course to
  # burn six hours of the account's minutes per push. Anything added here that
  # drives a browser owes a `timeout-minutes` whether or not it is expected to
  # pass — a hang is the default failure of a boot gate that cannot be satisfied,
  # not an unlikely one.
  #
  # **So parity stays a manual gate on a machine with a GPU**, which is what
  # `CLAUDE.md` already asks for: run `npm run parity` after anything touching
  # the world layer. To try CI again, the thing to establish FIRST — outside this
  # workflow, in a throwaway run — is whether Dawn will hand a software adapter
  # to `channel: "chromium"` on the runner image at all. If it will not, no
  # arrangement of this job works and the answer is a self-hosted runner or
  # nothing. `VERIFYING.md` records that the Chromebook's Linux headless shell
  # DOES carry SwiftShader, which is the only reason to think it might.
  # ---------------------------------------------------------------------------

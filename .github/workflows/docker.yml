# .github/workflows/docker.yml — build the images and push them to GHCR.
#
# TWO images, because the deployment is two containers and the Dockerfile has a
# runtime stage for each:
#
#   web     ghcr.io/greywatch-game/greywatch         nginx + dist/ — the game
#   server  ghcr.io/greywatch-game/greywatch-server  node + dist-server/ — the authority
#
#   main    -> :main    + :latest
#   develop -> :develop
#
# Every push also gets an immutable :sha-<short> tag, which is what you roll
# back to; the branch tags move. **The two images are tagged from the same
# commit and are meant to be deployed together** — the wire protocol is versioned
# (`PROTOCOL_VERSION`), and a client one version off is refused at the handshake
# with a message saying so, which is a legible failure but still a failure.
#
# `target:` is not optional here and was the bug: without it Docker builds the
# LAST stage in the Dockerfile, which is `web`, so the server image was never
# built and there was nothing to deploy the match server FROM.
#
# **The registry is GitHub's own, and it needs no secret at all**: `GITHUB_TOKEN`
# is minted for this run and `packages: write` below is the whole of what lets it
# push, so there is no registry credential in this repository to rotate or leak.
# What it costs is one manual step, ONCE per image, that nothing in here can do
# for itself: **a new GHCR package is PRIVATE even when the repository is
# public.** Until each package's visibility is set to Public in its own settings,
# `docker compose -f docker-compose.prod.yml pull` on a deploy box fails with
# `denied`, which reads like a misspelt image name rather than a permission — and
# it fails on EVERY box, since a region pulls both images for itself. The only
# other way is a `read:packages` token and a `docker login ghcr.io` on every box,
# forever, which is the credential this registry was chosen to be rid of.
#
# A package name must be LOWERCASE. `greywatch-game` already is; it would only
# bite if these were ever templated off `github.repository_owner`.
name: Docker

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

# A second push to the same branch makes the in-flight build irrelevant — the
# tags it would move are about to be moved again. The group covers the whole
# run, so both images in a superseded build are cancelled together and a branch
# can never end up with a new web image beside a stale server one.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # What lets `GITHUB_TOKEN` push to GHCR. Without it the login succeeds and
      # the push is the thing that 403s, at the end of the build.
      packages: write

    strategy:
      # Both images or neither: a web build that succeeded while the server
      # build failed is a deployment that half-updates.
      fail-fast: true
      matrix:
        include:
          - target: web
            image: ghcr.io/greywatch-game/greywatch
          - target: server
            image: ghcr.io/greywatch-game/greywatch-server

    name: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `npm ci` is the slow layer and the lockfile rarely moves, so the
          # cache is worth more here than the ~1 min the build itself takes.
          #
          # Scoped per target because the two legs run concurrently and a shared
          # `mode=max` scope has them writing the same cache manifest. The price
          # is that the `build` stage — which both runtime stages copy from — is
          # cached twice; it is the same bytes and it is not worth a serialised
          # pipeline to save.
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
